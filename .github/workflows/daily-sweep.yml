name: daily-sweep
run-name: "daily-sweep${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && ' (dry run)' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.max_per_agent_mon != '' && ' (capped test)' || '' }}"
# PolicyPilot showcase agents (operated by the team). ALPHA / UNAUDITED. Agent keys only (no deployer/owner key).
# Daily cycle, GitHub-only (runner/daily-sweep.mjs):
#   1. agents exit the team clip/spread pools
#   2. each agent calls sweepToOwner() on its ShowcaseAgentVault: everything above exactly 1 MON goes to the vault's
#      immutable owner = the deployer 0xc0c4…6113 (no destination input exists); paused vaults are unpaused first
#   3. each agent sends its own MON above target (20; idle 0.5) to the hard-coded deployer
#   4. ShowcaseRefiller v3 refill(true): vaults back to 1 MON, agents back to target (agents never go below target)
#   5. heartbeat: web/public/ops-status-143.json
# Triggers: two crons + runner/kick-workflows.sh (every showcase round after 04:07 UTC) + ops-watchdog.yml (after 05:00 UTC).
# One real sweep per UTC day (guard); everything is idempotent anyway (sweep-to-1 and top-up-to-target).
# RPC fallback + nonce/stuck-tx handling: runner/chain-util.mjs. agent-refill skips 04:00-04:50 UTC and while this runs.
# Never pauses vaults. Kill switch: repo variable DAILY_SWEEP_ENABLED = 'false' (unset = enabled).
on:
  schedule:
    - cron: '7 4 * * *'
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run: { description: 'Simulate only (send nothing)', type: boolean, default: true }
      max_per_agent_mon: { description: 'Test cap per agent in MON (blank = full surplus)', type: string, default: '' }
      kick: { description: 'Dispatched by runner/kick-workflows.sh (treated like a scheduled run)', type: boolean, default: false }
permissions: { contents: write, actions: read }
concurrency: { group: daily-sweep, cancel-in-progress: false }
jobs:
  sweep:
    if: ${{ vars.DAILY_SWEEP_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: { RPC: 'https://rpc.monad.xyz', GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}' }
    steps:
      - name: Guard (one real sweep per UTC day; wait for a running agent-refill)
        id: guard
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ inputs.kick }}" = true ]; then
            since=$(date -u +%Y-%m-%dT04:00:00Z)   # one real sweep per UTC day (counted from 04:00 UTC)
            n=$(gh run list -R "$REPO" -w daily-sweep.yml --status success -L 30 --json databaseId,displayTitle,createdAt \
              | jq --arg s "$since" --argjson me "${{ github.run_id }}" '[.[]|select(.displayTitle=="daily-sweep" and .createdAt>$s and .databaseId!=$me)]|length')
            if [ "$n" -gt 0 ]; then echo "a real sweep already succeeded since $since: skipping"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          for i in $(seq 1 40); do
            busy=$(gh run list -R "$REPO" -w agent-refill.yml -L 10 --json status | jq '[.[]|select(.status=="in_progress")]|length')
            [ "$busy" = 0 ] && break; echo "agent-refill is running; waiting ($i)"; sleep 15
          done
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with: { node-version: 22 }
      - name: Install runner deps
        if: steps.guard.outputs.skip != 'true'
        run: cd runner && npm ci --no-audit --no-fund
      - name: Sweep vaults (to 1 MON) and agent surplus to the deployer, then re-fund from the refiller
        if: steps.guard.outputs.skip != 'true'
        env:
          OUT: /tmp/daily-sweep.json
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          MAX_PER_AGENT_MON: ${{ github.event_name == 'workflow_dispatch' && inputs.max_per_agent_mon || '' }}
          AGENT_KEY_DCA: ${{ secrets.AGENT_KEY_DCA }}
          AGENT_KEY_STAKER: ${{ secrets.AGENT_KEY_STAKER }}
          AGENT_KEY_PAYROLL: ${{ secrets.AGENT_KEY_PAYROLL }}
          AGENT_KEY_ROGUE: ${{ secrets.AGENT_KEY_ROGUE }}
          AGENT_KEY_DCA1: ${{ secrets.AGENT_KEY_DCA1 }}
          AGENT_KEY_MM: ${{ secrets.AGENT_KEY_MM }}
          AGENT_KEY_REBALANCER: ${{ secrets.AGENT_KEY_REBALANCER }}
          AGENT_KEY_TIPPER: ${{ secrets.AGENT_KEY_TIPPER }}
          AGENT_KEY_TESTER: ${{ secrets.AGENT_KEY_TESTER }}
          AGENT_KEY_DCA3: ${{ secrets.AGENT_KEY_DCA3 }}
          AGENT_KEY_STAKER3: ${{ secrets.AGENT_KEY_STAKER3 }}
          AGENT_KEY_PAYROLL3: ${{ secrets.AGENT_KEY_PAYROLL3 }}
          AGENT_KEY_ROGUE3: ${{ secrets.AGENT_KEY_ROGUE3 }}
        run: node runner/daily-sweep.mjs
      - name: Heartbeat (web/public/ops-status-143.json)
        if: ${{ always() && steps.guard.outputs.skip != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: bash runner/ops-status.sh sweep /tmp/daily-sweep.json
