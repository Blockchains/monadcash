# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: policypilot-indexer
description: Indexes PolicyPilot policy + execution events on Monad testnet (RPC source, no HyperSync token needed)
field_selection:
  transaction_fields:
    - hash
contracts:
  - name: PolicyPilot
    abi_file_path: abis/PolicyPilot.json
    handler: src/EventHandlers.ts
    events:
      - event: Executed
      - event: RecipientSet
      - event: PerRequestLimitSet
      - event: BudgetSet
      - event: PausedSet
chains:
  - id: 10143
    start_block: 70561954
    rpc:
      - url: ${ENVIO_MONAD_RPC_URL:-https://testnet-rpc.monad.xyz/}
        for: sync
        initial_block_interval: 100
        interval_ceiling: 100
    contracts:
      - name: PolicyPilot
        address: 0x583fDB6441a9bCE517CF5bb15b9dB7340BB57D4E
